<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233d">
  <meta name="description" content="General medication and infusion calculator concept. Arithmetic-only prototype — not for patient care.">
  <title>Pediatric Transport Calculator · Option 2 Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="calculator.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container compact-page">
    <aside class="safety" role="note">
      <strong>PROTOTYPE · NOT FOR PATIENT CARE</strong>
      <span>Arithmetic demo only. No dose recommendations, no clinical safety checks, and no patient data storage.</span>
    </aside>

    <section class="shell" aria-labelledby="title">
      <div class="shell-head">
        <div class="head-top">
          <button id="home" class="mini-home" type="button" aria-label="Back to calculator menu">HOME</button>
          <span id="eyebrow">PEDIATRIC TRANSPORT CALCULATOR</span>
          <span id="step-indicator">SELECT CALCULATOR</span>
        </div>
        <h1 id="title">Choose a calculator</h1>
        <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
      </div>
      <div id="screen" class="screen" aria-live="polite" aria-atomic="true"></div>
      <nav id="navigation" class="navigation" aria-label="Calculator navigation"></nav>
    </section>
  </main>
</body>
</html>
